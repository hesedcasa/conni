name: Run end-to-end tests

permissions: read-all

# On demand from the default branch only. These tests create fixtures in one
# live Confluence sandbox, so running them per pull request would let concurrent
# runs collide, and fork PRs cannot get the OIDC token they need for the
# sandbox credentials. The default-branch gate also keeps a manual dispatch of
# an untrusted ref from running repository code with those credentials.
on:
  workflow_dispatch:

concurrency:
  group: conni-e2e
  cancel-in-progress: false

jobs:
  # Everything that installs or builds runs here, with no OIDC permission: a
  # compromised `npm ci` or `npm install sdkck` lifecycle script can neither
  # read the sandbox credentials nor request a token to fetch them itself.
  build:
    name: Build the CLI and install the sdkck host
    # The test and sweep jobs need this one, so they are skipped with it.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sdkck-setup: ${{ steps.sdkck.outcome }}
    steps:
      - name: Check out repository
        # Pinned to a full SHA: these actions run before repository code gets
        # the credentials, so a moved mutable tag could swap what executes.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          # Nothing here pushes, and the default would leave GITHUB_TOKEN in
          # the workspace git config for every later step to reuse.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: npm
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Build the CLI
        run: npm run build

      # For the second leg: the same suite through the latest sdkck host CLI
      # with this build packed and installed as its @hesed/conni plugin —
      # covering the `prepack` artifacts (oclif.manifest.json, README) and
      # plugin dispatch under a host. The plugin is installed before any
      # `sdkck conni` call so sdkck's first-use auto-installer cannot fetch
      # the published release over this build. The throwaway sdkck home keeps
      # the install, config and caches out of the runner's real sdkck setup;
      # the test side finds it via E2E_SDKCK_HOME. `continue-on-error`, so a
      # broken sdkck release still lets the standalone leg run; the step's own
      # timeout keeps a stalled install from hitting the job timeout, which
      # `continue-on-error` cannot absorb and which would skip the upload.
      - name: Install the latest sdkck and the packed plugin
        id: sdkck
        continue-on-error: true
        timeout-minutes: 5
        run: |
          npm install --no-save sdkck
          home="$RUNNER_TEMP/sdkck-home"
          mkdir -p "$home"
          export SDKCK_CACHE_DIR="$home/cache" SDKCK_CONFIG_DIR="$home/config" SDKCK_DATA_DIR="$home/data"
          # A fresh home cannot hold the plugin yet; if it does, the leg would
          # test whatever is there rather than this build. `plugins inspect` is
          # a host command, so the probe cannot itself trigger sdkck's
          # first-use install.
          if ./node_modules/.bin/sdkck plugins inspect @hesed/conni --json >/dev/null 2>&1; then
            echo "error: @hesed/conni is already installed in the throwaway sdkck home" >&2
            exit 1
          fi
          # A `file:` URL is required: sdkck resolves any bare path containing
          # a slash as a GitHub org/repo. Packing into the throwaway home
          # keeps the tarball out of the workspace.
          tgz="$(npm pack --pack-destination "$home" | tail -n 1)"
          ./node_modules/.bin/sdkck plugins install "file:$home/$tgz"
          # Prove dispatch resolves to the tarball this run packed, not a
          # published release the auto-installer could have fetched: the
          # install record sdkck writes under the data dir must carry our
          # file: URL. The record is read from disk rather than via
          # `sdkck plugins inspect`, which has been observed to die on an
          # unsettled top-level await right after loading a freshly
          # installed plugin.
          grep -Fq "\"file:$home/$tgz\"" "$SDKCK_DATA_DIR/package.json"

      # Only the build outputs travel: the jobs that hold the credentials check
      # out the repository themselves, so a lifecycle script that edits or
      # adds a source, test or script file here cannot get it run there.
      # node_modules and the sdkck plugin are still installed code — the tests
      # cannot run without them — so this narrows, not removes, that trust.
      # A tarball rather than the artifact's own zip, which drops executable
      # bits and node_modules/.bin symlinks. Absolute paths are kept because
      # the sdkck install records them, and hosted runners share one layout.
      - name: Pack the build outputs and sdkck home
        run: |
          mkdir -p "$RUNNER_TEMP/sdkck-home"
          tar -czf "$RUNNER_TEMP/e2e-workspace.tgz" -C / \
            "${GITHUB_WORKSPACE#/}/node_modules" "${GITHUB_WORKSPACE#/}/dist" \
            "${RUNNER_TEMP#/}/sdkck-home"

      - name: Upload the workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-workspace
          path: ${{ runner.temp }}/e2e-workspace.tgz
          retention-days: 1

  run-e2e-tests:
    name: End-to-end tests against the Confluence sandbox
    needs: build
    runs-on: ubuntu-latest
    # Two legs (standalone CLI, then the same suite via sdkck) of up to 20
    # minutes each, plus up to 10 minutes of setup (checkout, unpack, the
    # credential fetch), so a slow setup cannot cut the sdkck leg short.
    timeout-minutes: 50
    # id-token lets the Infisical action exchange GitHub's OIDC token for the
    # sandbox credentials, so no Infisical secret is stored in the repo. Only
    # this job and the sweep have it, and nothing in either installs packages.
    permissions:
      contents: read
      id-token: write
    steps:
      # A fresh checkout of the dispatched commit, not the build job's copy:
      # see "Pack the build outputs and sdkck home".
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download the build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-workspace
          path: ${{ runner.temp }}

      # Extracts only the named members, so nothing else in the archive can
      # land over the checkout.
      - name: Unpack the build outputs and sdkck home
        run: |
          tar -xzf "$RUNNER_TEMP/e2e-workspace.tgz" -C / \
            "${GITHUB_WORKSPACE#/}/node_modules" "${GITHUB_WORKSPACE#/}/dist" \
            "${RUNNER_TEMP#/}/sdkck-home"
          echo "E2E_SDKCK_HOME=$RUNNER_TEMP/sdkck-home" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'

      # The Infisical action exports the sandbox credentials to $GITHUB_ENV,
      # so every later step sees them; the steps before it never do.
      - name: Fetch sandbox credentials from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: dev

      # Step-level timeouts, not just the job's: a hung standalone run fails
      # only its own step, so the sdkck leg (which runs unless cancelled) still
      # gets its turn. The job-level timeout stays as the outer backstop.
      - name: Run end-to-end tests
        timeout-minutes: 20
        run: npm run e2e:mocha
        env:
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run end-to-end tests via sdkck
        if: ${{ !cancelled() && needs.build.outputs.sdkck-setup == 'success' }}
        timeout-minutes: 20
        run: npm run e2e:mocha
        env:
          E2E_HOST_CLI: sdkck
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

      # The build job tolerated a failed sdkck setup so the standalone leg
      # could still run; fail here so the run doesn't pass without the sdkck
      # leg.
      - name: Fail if sdkck setup failed
        if: ${{ always() && needs.build.outputs.sdkck-setup != 'success' }}
        run: |
          echo "::error::sdkck setup failed in the build job; sdkck leg skipped"
          exit 1

  # A separate job, not a step with `if: always()`: a job cancelled by its
  # timeout-minutes never starts its remaining steps, so an in-job fallback
  # sweep would be skipped in exactly the scenario it exists for. A dependent
  # job with `if: always()` still runs when the test job fails, times out, or
  # is cancelled — only a failed or skipped build has nothing to reclaim, since
  # no test ran. E2E_RUN_ID is derivable in any job of the same workflow run,
  # which is what lets this sweep delete the test job's pages. It reuses the
  # build job's node_modules, so it installs nothing while holding id-token.
  sweep-fixtures:
    name: Sweep leftover fixtures
    runs-on: ubuntu-latest
    needs: [build, run-e2e-tests]
    if: always() && needs.build.result == 'success'
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # A fresh checkout of the dispatched commit, not the build job's copy:
      # see "Pack the build outputs and sdkck home".
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download the build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-workspace
          path: ${{ runner.temp }}

      # The sweep runs from source via ts-node, so it needs node_modules only.
      - name: Unpack node_modules
        run: tar -xzf "$RUNNER_TEMP/e2e-workspace.tgz" -C / "${GITHUB_WORKSPACE#/}/node_modules"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'

      - name: Fetch sandbox credentials from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: dev

      # Deletes this run's labelled pages (E2E_RUN_ID) and any fixtures older
      # than the stale threshold, then purges trashed e2e pages.
      - name: Sweep leftover fixtures
        run: npm run e2e:sweep
        env:
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
