# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    ignore:
      # marked is here only so src/markdown.ts can flip `breaks` on the lexer
      # marklassian calls, which needs both packages to resolve one copy of
      # marked. A major past marklassian's range (`^15.0.6 || ^16.0.0` as of
      # marklassian 1.2.1) nests a second copy and silently drops line breaks,
      # so it stays pinned until marklassian itself moves.
      - dependency-name: marked
        update-types:
          - version-update:semver-major
